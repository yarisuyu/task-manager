services:
  db:
    image: postgres:16
    container_name: taskmanager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaskManagerDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend/TaskManager
    container_name: taskmanager-backend
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=TaskManagerDb;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      - db

  frontend:
    build: ./frontend/task-manager-client
    container_name: taskmanager-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: